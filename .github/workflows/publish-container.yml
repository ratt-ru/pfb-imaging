name: Publish Container

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Cab generation is handled by pre-commit hooks locally.
# This workflow only builds and pushes container images so users can test
# hotfixes using stimela (which pulls images specified in cab definitions).

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Build each architecture on its own native runner and push by digest; the
  # `merge` job then stitches the digests into one multi-arch manifest.
  #
  # Native arm64 rather than QEMU: the arm64 image compiles ducc0 (and, with
  # the casacore extra, python-casacore and numcodecs) from source because no
  # aarch64 wheels exist. Under docker/setup-qemu-action that runs roughly an
  # order of magnitude slower and reliably exceeds the job timeout. GitHub's
  # `ubuntu-24.04-arm` runners are free for public repositories.
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            suffix: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            suffix: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # Per-arch layer cache; the arm64 source builds benefit most.
          cache-from: type=gha,scope=${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=${{ matrix.suffix }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true

      - name: Export digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.suffix }}
          path: /tmp/digests/*
          retention-days: 1
          if-no-files-found: error

  # Assemble the per-arch images into one multi-arch manifest and apply the real
  # tags. This is what makes `docker pull ghcr.io/ratt-ru/pfb-imaging:latest`
  # resolve to the arm64 image on a DGX Spark and amd64 everywhere else.
  merge:
    name: Merge manifest
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for container
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # For version tags: v1.2.3 -> 1.2.3, 1.2; v0.0.9rc1 -> 0.0.9rc1
            type=pep440,pattern={{version}}
            type=pep440,pattern={{major}}.{{minor}}
            # For PRs: use branch name (e.g., ghcr.io/user/repo:feature-branch)
            type=raw,value=${{ github.head_ref }},enable=${{ github.event_name == 'pull_request' }}
            # For main branch: use 'latest'
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Create multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:%s ' *)

      - name: Inspect manifest
        run: |
          set -euo pipefail
          TAG=$(jq -cr '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "$TAG"
          # Fail loudly rather than silently shipping a single-arch manifest
          # under a tag users will assume is multi-arch.
          for arch in amd64 arm64; do
            docker buildx imagetools inspect --raw "$TAG" \
              | jq -e --arg a "$arch" '[.manifests[]?.platform.architecture] | index($a)' > /dev/null \
              || { echo "::error::$arch missing from manifest for $TAG"; exit 1; }
          done

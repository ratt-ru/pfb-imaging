name: Warm Caches

# ci.yml runs on pull requests only. GitHub scopes caches by ref: a PR run can
# restore caches saved on its own ref or its base branch (main), never another
# PR's. With no CI run on main, every new PR would start cold. Only two of
# those caches are worth keeping warm from here:
#
#   * the aarch64 source builds -- ducc0 (and numcodecs, while zarr<3 pins it)
#     compile from sdist on arm, which is the slowest part of that leg;
#   * the CASA measures, fetched from ftp.astron.nl, which is flaky.
#
# The x86_64 uv cache is not warmed: setup-uv prunes pre-built wheels before
# saving, so on x86 (everything a wheel) it saves next to nothing, and a sync
# here would buy no time on the PR. The numba kernel cache is not warmed
# either: filling it means running the suite, the post-merge cost this split
# removes, so a PR's first run JIT-compiles cold and its later pushes restore
# their own cache.
#
# The keys must stay identical to the ones ci.yml and acceptance.yml restore.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  aarch64-builds:
    name: Warm aarch64 source builds (py3.12, full-only)
    runs-on: ubuntu-24.04-arm
    env:
      CMAKE_ARGS: "-DDUCC0_ARCH_FLAGS=-march=armv8.2-a"
    steps:
      # update-cabs.yml pushes regenerated cabs to main tagged to skip checks;
      # they never touch uv.lock, so the previous push's builds still hold.
      - name: Check for skip checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(gh api repos/${{ github.repository }}/commits/${{ github.sha }} --jq '.commit.message')
          if echo "$MSG" | grep -qF '[skip checks]'; then
            echo "SKIP_CHECKS=true" >> "$GITHUB_ENV"
          fi

      - name: Check out code
        if: env.SKIP_CHECKS != 'true'
        uses: actions/checkout@v7

      - name: Set up Python 3.12
        if: env.SKIP_CHECKS != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install aarch64 build dependencies
        if: env.SKIP_CHECKS != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config

      - name: Set up uv
        if: env.SKIP_CHECKS != 'true'
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          activate-environment: true

      - name: Cache source builds (aarch64)
        if: env.SKIP_CHECKS != 'true'
        uses: actions/cache@v6
        with:
          key: aarch64-builds-3.12-full-only-${{ hashFiles('uv.lock') }}
          restore-keys: aarch64-builds-3.12-full-only-
          path: ~/.cache/uv

      - name: Install pfb-imaging
        if: env.SKIP_CHECKS != 'true'
        run: uv sync --extra full --group dev --frozen

  casa-measures:
    name: Warm CASA measures
    runs-on: ubuntu-latest
    steps:
      - name: Load cached CASA Measures Data
        id: load-cached-casa-measures
        uses: actions/cache@v6
        with:
          key: casa-measures-v1
          path: |
            ~/measures
            ~/.casarc

      - name: Download and install CASA Measures Data
        if: steps.load-cached-casa-measures.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/measures
          for i in {1..3}; do
            if curl -sS --disable-epsv --max-time 300 \
                 ftp://ftp.astron.nl/outgoing/Measures/WSRT_Measures.ztar \
                 --output WSRT_Measures.ztar; then
              break
            elif [ $i -eq 3 ]; then
              echo "::error::Could not fetch WSRT_Measures.ztar from ftp.astron.nl after 3 attempts."
              exit 1
            else
              echo "Retrying download ($i/3)..."; sleep 5
            fi
          done
          tar xzf WSRT_Measures.ztar -C ~/measures
          echo "measures.directory: ~/measures" > ~/.casarc

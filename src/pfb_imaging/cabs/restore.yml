cabs:
  restore:
    flavour: python
    command: pfb_imaging.core.restore.restore
    name: restore
    info:
      Restore model images and.or convolved images to common resolution.
    image: ghcr.io/ratt-ru/pfb-imaging:degrid-msv4
    inputs:
      output-filename:
        info:
          Basename of output
        required: true
        policies:
          positional: true
        metadata:
          rich_help_panel: Naming
      model-name:
        info:
          Name of the model variable in the band nodes of the dt
        default: MODEL
        metadata:
          rich_help_panel: Input
      residual-name:
        info:
          Name of the residual variable in the band nodes of the dt
        default: RESIDUAL
        metadata:
          rich_help_panel: Input
      suffix:
        info:
          Can be used to specify a custom name for the image space data products.
          This is useful for distinguishing runs with different imaging paramaters.
          For example, different image sizes of robustness factors.
        default: main
        metadata:
          rich_help_panel: Naming
      outputs:
        info:
          Output products.
          (d)irty, (m)odel, (r)esidual, (k) restored with intrinsic model and apparent residual.
          (a) restored fully apparent, (i) restored fully intrinsic (primary beam corrected).
          (c)lean beam image, (f)ft of the residual.
          (s)moothed residual, the residual convolved to the restoring resolution.
          Use capitals to produce corresponding cubes.
        default: kK
        metadata:
          rich_help_panel: Output
      gausspar:
        info:
          Gaussian parameters (e-major, e-minor, position-angle) specifying restoring resolution.
          All parameters need to be specified in units of degrees.
          The default resolution is the native resolution in each imaging band.
          This parameter can be used to homogenise the resolution of the cubes.
          Set to (0,0,0) to use the resolution of the lowest band.
        dtype: Optional[Tuple[float, float, float]]
        metadata:
          rich_help_panel: Restoration
      drop-bands:
        info:
          List of bands to discard.
        dtype: Optional[List[int]]
        metadata:
          rich_help_panel: Data Selection
      pb-min:
        info:
          Primary beam cutoff for the intrinsic restored image.
          Pixels where the beam falls below this value are set to zero.
        dtype: float
        default: 0.1
        metadata:
          rich_help_panel: Restoration
      nthreads:
        info:
          Number of threads used to scale vertically (for FFTs and gridding).
          Each dask thread can in principle spawn this many threads.
          Will attempt to use half the available threads by default.
        dtype: Optional[int]
        metadata:
          rich_help_panel: Performance
      product:
        info:
          String specifying which Stokes products to produce.
          Outputs are always be alphabetically ordered.
        default: I
        metadata:
          rich_help_panel: Data Selection
    outputs:
      mfs-image:
        dtype: File
        implicit: '{current.output-filename}_{current.product}_{current.suffix}_kimage_time0_mfs.fits'
      image:
        dtype: File
        implicit: '{current.output-filename}_{current.product}_{current.suffix}_kimage_time0.fits'
      log-directory:
        dtype: Directory
        info:
          Directory to write logs and performance reports to.
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      fits-output-folder:
        dtype: Directory
        info:
          Optional path to write fits files to.
          Set to output-filename if not provided.
          The same naming conventions apply.
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      numba-cache-dir:
        dtype: Directory
        info:
          Implicit output ensuring the numba cache location is mounted.
          The cache defaults to a per-user directory under the system temp directory.
          Override it by setting the NUMBA_CACHE_DIR environment variable.
        implicit: '/tmp/numba'
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true

cabs:
  degrid_msv4:
    flavour: python
    command: pfb_imaging.core.degrid_msv4.degrid_msv4
    name: degrid_msv4
    info:
      Degrid visibilities from a component model into MSv4 measurement sets.
      The model image needs to be in component format.
    image: ghcr.io/ratt-ru/pfb-imaging:degrid-msv4
    inputs:
      ms:
        info:
          Path to measurement set.
        dtype: List[URI]
        required: true
        policies:
          positional: true
        metadata:
          rich_help_panel: Input
        writable: true
      output-filename:
        info:
          Basename of output
        required: true
        policies:
          positional: true
        metadata:
          rich_help_panel: Naming
      channels-per-chunk:
        info:
          Number of channels per degridding chunk.
          Required.
          The model is re-rendered once per chunk so this sets how finely the model spectrum is sampled.
          Narrower chunks cost more FFTs at the same visibility count.
        dtype: int
        required: true
        policies:
          positional: true
        metadata:
          rich_help_panel: Chunking
      suffix:
        info:
          Can be used to specify a custom name for the image space data products.
          This is useful for distinguishing runs with different imaging paramaters.
          For example, different image sizes of robustness factors.
        default: main
        metadata:
          rich_help_panel: Naming
      mds:
        info:
          Optional path to mds to use for degridding.
          By default mds is inferred from output-filename.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Input
      model-column:
        info:
          Column to write model data to
        default: MODEL_DATA
        metadata:
          rich_help_panel: Output
      product:
        info:
          String specifying which Stokes products to produce.
          Outputs are always be alphabetically ordered.
        default: I
        metadata:
          rich_help_panel: Data Selection
      scan-names:
        info:
          List of SCAN_NUMBERS to image.
          Defaults to all.
          Input as comma separated list 0,2 if running from CLI.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      spw-names:
        info:
          List of DATA_DESC_ID's to images.
          Defaults to all.
          Input as comma separated list 0,2 if running from CLI.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      field-names:
        info:
          List of FIELD_ID's to image.
          Defaults to all.
          Input as comma separated list 0,2 if running from CLI.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      freq-range:
        info:
          Frequency range to image in Hz.
          Specify as a string with colon delimiter ('1e9:1.1e9').
        dtype: Optional[str]
        metadata:
          rich_help_panel: Data Selection
      data-group:
        info:
          MSv4 data group used to resolve the 'DATA' column to its correlated_data variable.
          Also selects the field_and_source subtable.
        default: base
        metadata:
          rich_help_panel: Data Selection
      partition-columns:
        info:
          Columns to partition the MSv4 store by (xarray-ms PARTITION_SCHEMA).
          Defaults to FIELD_ID,DATA_DESC_ID,SCAN_NUMBER; other instruments may need SOURCE_ID.
          Input as a comma separated list if running from CLI.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      integrations-per-chunk:
        info:
          Number of time integrations per degridding chunk.
          Default -1 degrids the whole partition in one chunk.
          This is a memory and parallelism knob only.
        dtype: int
        default: '-1'
        metadata:
          rich_help_panel: Chunking
      accumulate:
        info:
          Accumulate onto model column
        dtype: bool
        default: false
        metadata:
          rich_help_panel: Output
      region-file:
        info:
          A region file containing regions that need to be converted to separate measurement set columns.
          Each region in the file will end up in a separate column labelled as model-column{#}.
          The remainder of the fields goes into model-column.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Input
      epsilon:
        info:
          Gridder accuracy
        dtype: float
        default: 1.0e-07
        metadata:
          rich_help_panel: WGridder
      do-wgridding:
        info:
          Perform w-correction via improved w-stacking
        dtype: bool
        default: true
        metadata:
          rich_help_panel: WGridder
      ray-address:
        info:
          Address of the ray cluster to connect to.
          If not provided, will run locally.
        default: local
        metadata:
          rich_help_panel: Performance
      nworkers:
        info:
          Number of worker processes.
          Use with distributed scheduler.
        dtype: int
        default: 1
        metadata:
          rich_help_panel: Performance
      nthreads:
        info:
          Number of threads used to scale vertically (for FFTs and gridding).
          Each dask thread can in principle spawn this many threads.
          Will attempt to use half the available threads by default.
        dtype: Optional[int]
        metadata:
          rich_help_panel: Performance
      progressbar:
        info:
          Display progress.
          Use --no-progressbar to deactivate.
        dtype: bool
        default: true
        metadata:
          rich_help_panel: Reporting
    outputs:
      log-directory:
        dtype: Directory
        info:
          Directory to write logs and performance reports to.
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      numba-cache-dir:
        dtype: Directory
        info:
          Implicit output ensuring the numba cache location is mounted.
          The cache defaults to a per-user directory under the system temp directory.
          Override it by setting the NUMBA_CACHE_DIR environment variable.
        implicit: '/tmp/numba'
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true

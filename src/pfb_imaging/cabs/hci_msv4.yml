cabs:
  hci_msv4:
    flavour: python
    command: pfb_imaging.core.hci_msv4.hci_msv4
    name: hci_msv4
    info:
      High cadence imaging of MSv4 data.
      Same output as hci with larger time chunks.
    image: ghcr.io/ratt-ru/pfb-imaging:issue353
    inputs:
      ms:
        info:
          Path to measurement set
        dtype: List[URI]
        required: true
        policies:
          positional: true
        metadata:
          rich_help_panel: Input
      product:
        info:
          String specifying which Stokes products to produce.
          Outputs are always be alphabetically ordered.
        default: I
        metadata:
          rich_help_panel: Data Selection
      scan-names:
        info:
          Scan names to image.
          All scans if not set.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      spw-names:
        info:
          Spectral window names to image.
          All spectral windows if not set.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      field-names:
        info:
          Field names to image.
          All fields if not set.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Data Selection
      freq-range:
        info:
          Frequency range to image in Hz.
          Specify as a string with colon delimiter ('1e9:1.1e9').
        dtype: Optional[str]
        metadata:
          rich_help_panel: Data Selection
      overwrite:
        info:
          Allow overwrite of output xds
        dtype: bool
        default: false
        metadata:
          rich_help_panel: Control
      transfer-model-from:
        info:
          Not supported by hci-msv4 and refused.
          Use the degrid app to populate a model column instead.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Input
      data-column:
        info:
          Data column to image.
          Must be the same across MSs.
          Simple arithmetic is supported ('CORRECTED_DATA-MODEL_DATA').
          When gains are present this column will be corrected.
        default: DATA
        metadata:
          rich_help_panel: Data Selection
      data-group:
        info:
          MSv4 data group to read.
          DATA resolves to its correlated data variable.
        default: base
        metadata:
          rich_help_panel: Data Selection
      model-column:
        info:
          Model column to subtract from corrected data column.
          Useful to avoid high time res degridding.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Data Selection
      weight-column:
        info:
          Column containing natural weights.
          Must be the same across MSs
        dtype: Optional[str]
        metadata:
          rich_help_panel: Data Selection
      sigma-column:
        info:
          Not supported by hci-msv4 and refused, since xarray-ms does not expose SIGMA.
          Use --weight-column instead.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Data Selection
      flag-column:
        info:
          Column containing data flags.
          Must be the same across MSs
        default: FLAG
        metadata:
          rich_help_panel: Data Selection
      gain-table:
        info:
          Path to a QuartiCal gain term, gains.qc/NET or gains.qc::NET.
          Any term name is accepted.
          There must be a table for each MS.
          glob(ms) and glob(gt) should match up when running from CLI.
        dtype: Optional[List[URI]]
        metadata:
          rich_help_panel: Input
      max-simul-chunks:
        info:
          Maximum number of time blocks the writer holds in memory at once.
          Bounds writer memory together with images-per-chunk.
        dtype: int
        default: 2
        metadata:
          rich_help_panel: Performance
      images-per-chunk:
        info:
          Number of images per TIME chunk of the output cube.
          Downstream readers want long time axes.
          The writer holds max-simul-chunks such blocks per band in memory.
        dtype: int
        default: 128
        metadata:
          rich_help_panel: Performance
      integrations-per-image:
        info:
          Number of time integrations per image.
          Default (-1, 0, None) -> dataset per scan.
        dtype: int
        default: 1
        metadata:
          rich_help_panel: Imaging
      channels-per-image:
        info:
          Number of channels per image for gridding resolution.
          Default of (-1, 0, None) implies a single dataset per spw.
        dtype: int
        default: -1
        metadata:
          rich_help_panel: Imaging
      channels-per-bin:
        info:
          Number of channels per frequency bin for beam correction, deconvolution etc.
          This effectively upsamples the frequency resolution when doing beam correction and deconvolution.
          Default of -1 results in one bin per output image.
          Bins are collapsed via a weighted sum.
        dtype: int
        default: -1
        metadata:
          rich_help_panel: Imaging
      precision:
        info:
          Gridding precision
        choices:
        - single
        - double
        default: double
        metadata:
          rich_help_panel: Imaging
      beam-model:
        info:
          Which beam model to use.
        choices:
        - meerkat-beams
        metadata:
          rich_help_panel: Input
      primary-beam-band:
        info:
          Which band to use.
        choices:
        - U
        - L
        - S0
        - S4
        metadata:
          rich_help_panel: Input
      field-of-view:
        info:
          Field of view in degrees
        dtype: float
        default: 1.0
        metadata:
          rich_help_panel: Imaging
      super-resolution-factor:
        info:
          Will over-sample Nyquist by this factor at max frequency
        dtype: float
        default: 1
        metadata:
          rich_help_panel: Imaging
      cell-size:
        info:
          Cell size in arc-seconds
        dtype: Optional[float]
        metadata:
          rich_help_panel: Imaging
      nx:
        info:
          Number of x pixels
        dtype: Optional[int]
        metadata:
          rich_help_panel: Imaging
      ny:
        info:
          Number of y pixels
        dtype: Optional[int]
        metadata:
          rich_help_panel: Imaging
      psf-relative-size:
        info:
          Relative size of the PSF in pixels.
          A value of 1.0 means the PSF will be the same size as the image.
          The default is to make the PSF just big enough to extract the PSF parameters.
          Ideally requires double sized PSF.
        dtype: Optional[float]
        metadata:
          rich_help_panel: Imaging
      robustness:
        info:
          Robustness factor for Briggs weighting.
          None means natural
        dtype: Optional[float]
        metadata:
          rich_help_panel: Weighting
      target:
        info:
          Predefined celestial objects known to astropy.
          Or a string in the format 'HH:MM:SS,DD:MM:SS' (note the , delimiter).
          The image centre moves to the target.
          A named body moves between images, so it needs a single time bin.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Imaging
      l2-reweight-dof:
        info:
          The degrees of freedom parameter for L2 reweighting.
          The default (None) means no reweighting.
          A sensible value for this parameter depends on the level of RFI in the data.
          Small values result in aggressive reweighting.
          This should be avoided if the model is still incomplete.
        dtype: Optional[float]
        metadata:
          rich_help_panel: Weighting
      eta:
        info:
          Value to add to Hessian to make it invertible.
          Smaller values tend to fit more noise and make the inversion less stable.
        dtype: float
        default: 1.0e-05
        metadata:
          rich_help_panel: Imaging
      psf-out:
        info:
          Whether to produce output PSF's or not.
        dtype: bool
        default: false
        metadata:
          rich_help_panel: Output
      weight-grid-out:
        info:
          Not supported by hci-msv4 and refused.
          The hci scaffold has no weight_grid either.
        dtype: bool
        default: false
        metadata:
          rich_help_panel: Output
      natural-grad:
        info:
          Compute natural gradient.
          Needs a PSF twice the image size (--psf-relative-size 2).
        dtype: bool
        default: false
        metadata:
          rich_help_panel: Imaging
      inject-transients:
        info:
          YAML file containing transients to inject into the data.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Imaging
      filter-counts-level:
        info:
          Set minimum counts in the uniform weighting grid to the median divided by this value.
          This is useful to avoid artificially up-weighting nearly empty uv-cells.
        dtype: float
        default: 10.0
        metadata:
          rich_help_panel: Weighting
      npix-super:
        info:
          Half-size in pixels of the box used for super-uniform weighting.
          Each visibility is normalised by the sum of counts over a (2*npix_super+1)^2 box around its uv-cell.
          0 (default) recovers standard uniform weighting.
          Combines with robustness to give super-robust weighting.
        dtype: int
        default: 0
        metadata:
          rich_help_panel: Weighting
      min-padding:
        info:
          Minimum padding to be applied during gridding.
        dtype: float
        default: 2.0
        metadata:
          rich_help_panel: Imaging
      phase-dir:
        info:
          Rephase visibilities to this phase center.
          Should be a string in the format 'HH:MM:SS,DD:MM:SS' (note the , delimiter)
        dtype: Optional[str]
        metadata:
          rich_help_panel: Imaging
      epsilon:
        info:
          Gridder accuracy.
          Needs at least 1e-6 at single precision and 1e-12 at double.
        dtype: float
        default: 1.0e-05
        metadata:
          rich_help_panel: WGridder
      do-wgridding:
        info:
          Perform w-correction via improved w-stacking
        dtype: bool
        default: true
        metadata:
          rich_help_panel: WGridder
      double-accum:
        info:
          Accumulate onto grid using double precision.
          Only has an affect when using single precision.
        dtype: bool
        default: true
        metadata:
          rich_help_panel: WGridder
      ray-address:
        info:
          Address of the ray cluster to connect to.
          If not provided, will run locally.
          A multi-node cluster needs a filesystem shared by every node.
          It must hold the output store, measurement sets, gain terms and transient files.
        default: local
        metadata:
          rich_help_panel: Performance
      nworkers:
        info:
          Number of HciWorker actors.
          Each reads and images one image at a time.
        dtype: int
        default: 1
        metadata:
          rich_help_panel: Performance
      nthreads:
        info:
          Number of threads per HciWorker actor, used for gridding and FFTs.
          Will attempt to use half the available threads by default.
        dtype: Optional[int]
        metadata:
          rich_help_panel: Performance
      cg-tol:
        info:
          Tolerance of conjugate gradient algorithm
        dtype: float
        default: 0.001
        metadata:
          rich_help_panel: ConjugateGradient
      cg-maxit:
        info:
          Maximum iterations for conjugate gradient algorithm
        dtype: int
        default: 150
        metadata:
          rich_help_panel: ConjugateGradient
      object-store-memory:
        info:
          Object store memory (in GB) when using the distributed scheduler.
        dtype: Optional[float]
        metadata:
          rich_help_panel: Performance
      fits-vars:
        info:
          Write these variables to fits.
          Options are 'cube', 'cube_mean', 'psf' and 'beam_weight'.
          Variables are written per band.
        dtype: Optional[List[str]]
        metadata:
          rich_help_panel: Output
      wgt-mode:
        info:
          Controls how the Stokes weights are computed.
          l2 -> use standard Gaussian formula.
          minvar -> use minimum between correlations (wsclean Stokes I style).
        choices:
        - l2
        - minvar
        default: l2
        metadata:
          rich_help_panel: Weighting
      obs-label:
        info:
          Optional observation label to include in the stacked cube.
        dtype: Optional[str]
        metadata:
          rich_help_panel: Output
      flag-excess-rms:
        info:
          Flag data with RMS values exceeding the median by this factor.
        dtype: float
        default: 1.5
        metadata:
          rich_help_panel: Imaging
    outputs:
      output-dataset:
        dtype: Directory
        info:
          Basename of output.
          On a multi-node Ray cluster it must be on a filesystem every node can see.
        required: true
        policies:
          positional: true
        must_exist: true
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      log-directory:
        dtype: Directory
        info:
          Directory to write logs and performance reports to.
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      fits-output-folder:
        dtype: Directory
        info:
          Optional path to write fits files to.
          Written next to output-dataset if not provided.
          The same naming conventions apply.
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
        metadata:
          rich_help_panel: Output
      numba-cache-dir:
        dtype: Directory
        info:
          Implicit output ensuring the numba cache location is mounted.
          The cache defaults to a per-user directory under /tmp.
          Override it by setting the NUMBA_CACHE_DIR environment variable.
        implicit: '/tmp/numba-cache'
        must_exist: false
        mkdir: false
        path_policies:
          write_parent: true
      beam-cache-dir:
        dtype: Directory
        info:
          Implicit output ensuring the beam cache location is mounted.
          The cache defaults to a per-user directory under /tmp.
          Override it by setting the MBEAMS_CACHE_DIR environment variable.
        implicit: '/tmp/mbeams-cache'
        must_exist: false
        path_policies:
          write_parent: true

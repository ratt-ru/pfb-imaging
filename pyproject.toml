[project]
name = "pfb-imaging"
version = "0.0.11"
description = "Radio interferometric imaging suite based on a preconditioned forward-backward approach"
authors = [
    { name = "landmanbester", email = "lbester@sarao.ac.za" }
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.10, <3.14"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Astronomy"
]

dependencies = [
    "hip-cargo>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/ratt-ru/pfb-imaging"

[project.optional-dependencies]
# Full scientific stack
full = [
    "katbeam>=0.1",
    "pfb-model-spec[full]>=0.0.3",  # >=0.0.3 has utils.degrid (the degrid-msv4 kernel)
    "codex-africanus[dask,scipy,astropy,python-casacore] >= 0.4.4",
    "dask-ms[s3,xarray,zarr,katdal]>=0.2.31",
    "distributed>=2026.3.0",  # still need this for degrid command
    "reproject",
    "ray[default,serve]>=2.55.0",
    "radiomesh>=0.1.2 ; python_version >= '3.11'",
    "rarg-numba-patterns>=0.0.1",
    "rarg-python-patterns>=0.0.4 ; python_version >= '3.11'",
    "scikit-image>=0.24.0",
    "PyWavelets>=1.7.0",
    "numexpr>=2.10.1",
    "ducc0>=0.35.0",
    "sympy>=1.9",
    "tbb>=2021.13.1",
    "jax[cpu]>=0.4.31",
    "lz4>=4.3.3",
    "bokeh>=3.1.0",
    "regions>=0.9",
    "psutil>=5.9.8",
    "matplotlib>=3.9.2",
    "distributed>=2024.11.0",
    "pydantic>=2",
    "omegaconf>=2.3",
    "pillow>=12.2.0",
    "meerkat-beams[full]>=0.0.1 ; python_version >= '3.11'",
    # write support lives on the 0.4.0-alpha line, which is cut from commits
    # LATER than 0.5.x -- these version numbers do not order by capability.
    # Never raise these pins. See wiki design-decisions D14 and ratt-ru/xarray-ms#170.
    "xarray-ms>=0.4.0a7,<0.5.0 ; python_version >= '3.11'",
    "arcae>=0.4.0a8,<0.5.0 ; python_version >= '3.11'",
    "msv4-utils>=0.0.3 ; python_version >= '3.11'",
    "xarray-kat>=0.0.6 ; python_version >= '3.11'",
]


[project.scripts]
pfb = "pfb_imaging.cli:app"


[build-system]
requires = ["uv_build>=0.8.3,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 120
target-version = "py311"
# "*.md": ruff 0.16+ formats Python code blocks embedded in Markdown; our
# README/wiki snippets are illustrative signature fragments (e.g. `] = 10,`)
# that ruff would rewrite into standalone-valid but misleading code
# (`] = (10,)`). Keep the formatter to real Python files only.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["pfb_imaging"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "--verbose",
    # Fast by default: the end-to-end pipeline tests are deselected so the
    # development loop stays ~80s instead of ~400s. CI overrides with `-m ""`
    # (a command-line -m wins over this one). Run everything locally the same
    # way; `-m slow` runs only the deselected set.
    "-m",
    "not slow",
    # Drift guard: surfaces a newly-slow test in the fast loop's own output
    # instead of letting it quietly rot there.
    "--durations=10",
]
timeout = 300
timeout_method = "thread"
markers = [
    # Applied when a test's *cheapest* parametrisation costs >=2s. The
    # "cheapest" qualifier matters: several functions carry a one-off warm-up
    # (JIT, beam-model load, Ray spin-up) on whichever param runs first, which
    # is sticky to the run rather than the test -- marking those would evict
    # tests without removing the cost.
    "slow: Tests that take more time to run",
]

[dependency-groups]
dev = [
    "tbump>=6.11.0",
    "ruff>=0.8.0",
    "pre-commit>=4.0.0",
    "mypy>=1.0.0",
    "ipdb",
    "ipykernel>=7.2.0",
    "ipywidgets>=8.1.8",
    "pytest>=9.0.3",
    "pytest-timeout>=2.3",
    "stimela>=2",
]

[tool.uv]
prerelease="allow"
